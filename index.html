<!DOCTYPE html>
<html lang="th">
<head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจองถ่ายภาพ โรงเรียน</title>
    <style>
        /* ล้างค่าเริ่มต้นทั้งหมด */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* คำสั่งสำคัญ! ซ่อน Scrollbar ของหน้าหลัก */
        }

        /* บังคับ iframe ให้ยึดติดเต็มจอแบบ Fixed */
        iframe {
            position: fixed;  /* ยึดติดหน้าจอ ไม่ให้ขยับ */
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            z-index: 9999;    /* ให้มั่นใจว่าอยู่ชั้นบนสุด */
        }
    </style>
</head>
<body>
    <iframe src="https://script.google.com/macros/s/AKfycbxmsqmfkfZO-jTgAyJHe00Q0bso7Q-tqqajyWwDKroUrh1rZaoSXVWN76UYOrwlaCsGRg/exec"></iframe>
</body>
</html>
